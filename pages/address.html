<main class="space-y-6">
    <div class="bg-slate-900 text-white p-4 rounded-xl flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="text-sm">🔑 <strong>ช่องใส่คีย์:</strong> วาง Gemini API Key ของคุณตรงนี้</div>
        <input type="password" id="gemini-key-input" placeholder="วาง Gemini API Key ตรงนี้ (AQ...)" class="bg-slate-800 text-white text-xs rounded border border-slate-700 px-3 py-2 w-full md:w-80 focus:outline-none focus:border-emerald-500">
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-900 mb-1">📥 วางข้อความจากลูกค้า</label>
                <textarea id="raw-address-input" class="w-full h-36 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 font-mono" placeholder="วางชื่อที่อยู่ลูกค้าตรงนี้..."></textarea>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">⚖️ น้ำหนัก (kg)</label>
                    <input type="number" id="weight-input" value="1.0" step="0.1" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">🏷️ ราคาขาย (บาท)</label>
                    <input type="number" id="selling-price-input" value="350" step="10" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-emerald-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">📦 ทุนสินค้า (บาท)</label>
                    <input type="number" id="product-cost-input" value="150" step="10" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-rose-500">
                </div>
            </div>

            <button id="submit-ai-btn" onclick="processAddressAndShipping()" class="w-full bg-slate-900 text-white font-semibold text-sm py-3.5 rounded-xl hover:bg-slate-800 transition flex items-center justify-center gap-2">
                <span id="btn-text">✨ สั่ง AI จัดเรียงที่อยู่ + หาค่าส่งถูกที่สุด</span>
                <span id="loading-spinner" class="hidden">⏳</span>
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-semibold text-slate-900">✨ ผลลัพธ์จากการวิเคราะห์</label>
                <span id="status-badge" class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-medium">รอข้อมูล...</span>
            </div>

            <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl flex justify-between items-center shadow-sm">
                <div>
                    <div class="text-[10px] text-amber-700 font-medium">🚀 ขนส่งที่คุ้มที่สุดแนะนำโดย AI</div>
                    <div class="text-base font-bold text-slate-900" id="out-courier">-</div>
                    <div class="text-[11px] text-slate-500" id="out-reason">รอการวิเคราะห์</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-amber-700 font-medium">ราคาประเมิน</div>
                    <div class="text-2xl font-extrabold text-amber-600"><span id="out-price">0</span> <span class="text-xs font-normal text-slate-700">บาท</span></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[11px] text-slate-400">ชื่อผู้รับ</label><input type="text" id="out-name" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
                <div><label class="text-[11px] text-slate-400">เบอร์โทร</label><input type="text" id="out-phone" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
            </div>
            <div><label class="text-[11px] text-slate-400">ที่อยู่หลัก</label><input type="text" id="out-address1" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
            <div class="grid grid-cols-3 gap-2">
                <div><label class="text-[11px] text-slate-400">ตำบล</label><input type="text" id="out-subdistrict" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
                <div><label class="text-[11px] text-slate-400">อำเภอ</label><input type="text" id="out-district" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
                <div><label class="text-[11px] text-slate-400">จังหวัด</label><input type="text" id="out-province" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs"></div>
            </div>
            <div><label class="text-[11px] text-slate-400">รหัสไปรษณีย์</label><input type="text" id="out-zipcode" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold bg-amber-50"></div>

            <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                <button onclick="copyToClipboard()" class="border border-slate-200 text-slate-700 font-medium text-xs py-2.5 rounded-xl hover:bg-slate-50 transition">📋 คัดลอกที่อยู่รวม</button>
              <button onclick="generateAndPrintLabel()" class="bg-emerald-500 ...">
             🖨️ พิมพ์ใบปะหน้า + บันทึกบัญชี
            </button>
            </div>
        </div>
    </div>
</main>
